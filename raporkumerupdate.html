    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom Scrollbar for Dark Theme */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .loader {
            border: 3px solid #334155; border-radius: 50%; border-top: 3px solid #3b82f6;
            width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Print Specific Styles - Force Light Mode and Specific Layouts */

            body { background-color: white !important; color: black !important; font-size: 11pt; margin: 0; padding: 0; }
            .no-print, #sidebar, #topbar, #auth-section, #sidebar-overlay, button, select, label { display: none !important; }
            #app-content { margin: 0 !important; padding: 0 !important; width: 100% !important; background-color: white !important; overflow: visible !important; }
            #preview-rapor-container { display: block !important; border: none !important; box-shadow: none !important; padding: 0 !important; margin: 0 !important; }

            .print-area:last-child { page-break-after: auto; }
            .dark-text { color: black !important; }
            .dark-border { border-color: #000 !important; }
            .bg-darkpanel { background-color: white !important; color: black !important; border: none !important; }
            table { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 10px; }
            th, td { border: 1px solid black !important; padding: 6px 8px; text-align: left; color: black !important; font-size: 10pt; }
            th { background-color: #f1f5f9 !important; font-weight: bold; text-align: center; }
            td.border-none, th.border-none { border: none !important; }
            
            .ttd-container { display: flex; justify-content: space-between; margin-top: 40px; page-break-inside: avoid; color: black !important; }
            .ttd-kepsek { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 30px; page-break-inside: avoid; text-align: center; color: black !important; }
        }

</head>
<body class="bg-darkbg text-slate-200 min-h-screen antialiased">

    <div id="auth-section" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-darkpanel p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700 relative overflow-hidden">

            <div class="text-center mb-8">

                    <a href="#" id="link-register" class="text-sm text-primary hover:underline">Daftar sebagai Admin Sekolah Baru</a>

            <!-- Register Form (Admin Sekolah) -->
            <form id="register-form" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium mb-1">Nama Sekolah</label>
                    <input type="text" id="reg-sekolah" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-primary text-white">

                <div>
                    <label class="block text-sm font-medium mb-1">NPSN</label>

                    <label class="block text-sm font-medium mb-1">Password</label>

    </div>

    <!-- MAIN APPLICATION SECTION -->
    <div id="main-app" class="hidden flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-64 bg-darkpanel border-r border-slate-700 flex flex-col transition-all duration-300 z-20 absolute lg:relative h-full transform -translate-x-full lg:translate-x-0">
            <div class="h-16 flex items-center px-6 border-b border-slate-700 justify-between">
                <div class="flex items-center">
                    <i class="fa-solid fa-graduation-cap text-2xl text-primary mr-3"></i>
                    <span class="text-lg font-bold text-white truncate" id="sidebar-npsn-label">SaaS Kumer</span>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col h-full overflow-hidden w-full">

    <!-- Firebase SDK & Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, query, where, getDocs, addDoc, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDP_1enNeeVb_VqvV7LQ6q0bDeIXzl2YFE",
            authDomain: "raportkumer2026.firebaseapp.com",
            projectId: "raportkumer2026",
            storageBucket: "raportkumer2026.firebasestorage.app",
            messagingSenderId: "782029748844",
            appId: "1:782029748844:web:6b5c3f743a1f2622a83649",
            measurementId: "G-FD3KDV82WJ"
        };

        const app = initializeApp(firebaseConfig);
        const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp");
        const auth = getAuth(app);
        const secondaryAuth = getAuth(secondaryApp);
        const db = getFirestore(app);

        let currentUserState = null;
        let activeChart1 = null;
        let activeChart2 = null;
        let unsubscribeVerifikasi = null;

        const authSection = document.getElementById('auth-section');
        const mainApp = document.getElementById('main-app');
        const appContent = document.getElementById('app-content');
        const dynamicMenu = document.getElementById('dynamic-menu');
        const pageTitle = document.getElementById('page-title');
        
        // Logika Toggle Sidebar Mobile
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const btnToggleSidebar = document.getElementById('btn-toggle-sidebar');
        const btnCloseSidebar = document.getElementById('btn-close-sidebar');

        const toggleSidebar = () => {
            sidebar.classList.toggle('-translate-x-full');
            sidebarOverlay.classList.toggle('hidden');
        };

        btnToggleSidebar.addEventListener('click', toggleSidebar);
        btnCloseSidebar.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        const showToast = (title, icon = 'success') => {
            Swal.fire({ toast: true, position: 'top-end', icon: icon, title: title, showConfirmButton: false, timer: 3000, timerProgressBar: true, background: '#1e293b', color: '#fff' });
        };
        const showAlert = (title, text, icon) => {
            return Swal.fire({ title, text, icon, background: '#1e293b', color: '#fff', confirmButtonColor: '#3b82f6' });
        };
        const showConfirm = (title, text) => {
            return Swal.fire({ title, text, icon: 'warning', showCancelButton: true, confirmButtonColor: '#3b82f6', cancelButtonColor: '#ef4444', confirmButtonText: 'Ya, Lanjutkan', cancelButtonText: 'Batal', background: '#1e293b', color: '#fff' });
        };
        const setButtonLoading = (btnId, isLoading, originalText = 'Simpan') => {
            const btn = document.getElementById(btnId);
            if(!btn) return;
            if (isLoading) {
                btn.disabled = true; btn.innerHTML = `<span class="loader"></span> Menyimpan...`; btn.classList.add('opacity-70');
            } else {
                btn.disabled = false; btn.innerHTML = originalText; btn.classList.remove('opacity-70');
            }
        };

        const fileToBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        };

        // Helper fungsi populate dropdown kelas & mapel
        window.populateKelas = async (selectId, defaultText = "Pilih Kelas") => {
            const select = document.getElementById(selectId);
            if(!select) return;
            select.innerHTML = `<option value="">-- ${defaultText} --</option>`;
            
            const q = query(collection(db, "siswa"), where("npsn", "==", currentUserState.npsn));
            const snap = await getDocs(q);
            const classes = new Set();
            snap.forEach(d => classes.add(d.data().kelas));
            
            Array.from(classes).sort().forEach(c => {
                select.innerHTML += `<option value="${c}">${c}</option>`;
            });
        };

        window.populateMapel = async (selectId, defaultText = "Pilih Mapel") => {
            const select = document.getElementById(selectId);
            if(!select) return;
            select.innerHTML = `<option value="">-- ${defaultText} --</option>`;
            
            const q = query(collection(db, "mapel"), where("npsn", "==", currentUserState.npsn));
            const snap = await getDocs(q);
            
            snap.forEach(d => {
                select.innerHTML += `<option value="${d.data().nama}">${d.data().nama}</option>`;
            });
        };

        setPersistence(auth, browserLocalPersistence);

        document.getElementById('link-register').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.remove('hidden');
        });
        document.getElementById('link-login').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
        });

        // Register Admin Sekolah dengan perbaikan logika write ID unik agar sekolah kedua tidak menimpa sekolah pertama
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-register');
            const originalText = btn.innerHTML;
            setButtonLoading('btn-register', true, originalText);

            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const npsn = document.getElementById('reg-npsn').value.trim();
            const nama_sekolah = document.getElementById('reg-sekolah').value.trim();

            try {
                // Gunakan otentikasi secondary atau primary untuk registrasi baru
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                const uniqueUserId = user.uid; // Menggunakan UID unik dari Firebase Auth

                // Gunakan setDoc pada koleksi users dengan dokumen UID unik
                await setDoc(doc(db, "users", uniqueUserId), {
                    uid: uniqueUserId, 
                    email: email, 
                    nama: nama_sekolah + " Admin", 
                    role: 'admin_sekolah', 
                    npsn: npsn, 
                    status: 'pending', 
                    createdAt: new Date()
                });

                // Gunakan NPSN unik sebagai ID dokumen pada koleksi sekolah atau buat dokumen dengan ID timestamp jika diperlukan, 
                // namun karena NPSN adalah identitas unik sekolah, kita simpan dengan ID dokumen `npsn` secara aman (atau push timestamp jika multiple per npsn, tapi standar NPSN adalah unik).
                // Untuk mencegah tabrakan, pastikan dokumen sekolah di-set spesifik berdasarkan NPSN unik.
                const sekolahDocRef = doc(db, "sekolah", npsn);
                await setDoc(sekolahDocRef, {
                    npsn: npsn, 
                    nama_sekolah: nama_sekolah, 
                    alamat: "", 
                    tempat_penerbitan: "Borong", 
                    tahun_pelajaran_aktif: "2026/2027", 
                    semester_aktif: "Ganjil",
                    registeredAt: new Date()
                }, { merge: true });

                await signOut(auth);
                await Swal.fire({
                    title: 'Pendaftaran Berhasil!',
                    html: `Status akun Anda saat ini <b>PENDING</b>.<br><br>Harap segera hubungi Super Admin melalui WhatsApp/Telepon:<br><br><b style="font-size: 1.2rem; color: #3b82f6;">085183859997</b><br><br>Lampirkan <b>Nama Sekolah (${nama_sekolah})</b> dan <b>NPSN (${npsn})</b> untuk proses verifikasi agar akun diaktifkan.`,
                    icon: 'info', background: '#1e293b', color: '#fff', confirmButtonColor: '#3b82f6'
                });
                document.getElementById('link-login').click();

            } catch (error) { showAlert('Error', error.message, 'error'); } finally { setButtonLoading('btn-register', false, originalText); }
        });

        // Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const originalText = btn.innerHTML;
            setButtonLoading('btn-login', true, originalText);

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                if(email === "1988.gordi.vandi@gmail.com") {
                    try {
                        const superAdminCredential = await signInWithEmailAndPassword(auth, email, password);
                        await setDoc(doc(db, "users", superAdminCredential.user.uid), {
                            uid: superAdminCredential.user.uid, email: email, nama: "Gordi Vandi (Super Admin)", role: 'super_admin', npsn: 'ALL', status: 'active'
                        }, { merge: true });
                    } catch(authErr) {
                        if(authErr.code === 'auth/user-not-found' || authErr.code === 'auth/invalid-credential') {
                            const newSA = await createUserWithEmailAndPassword(auth, email, password);
                            await setDoc(doc(db, "users", newSA.user.uid), {
                                uid: newSA.user.uid, email: email, nama: "Gordi Vandi (Super Admin)", role: 'super_admin', npsn: 'ALL', status: 'active'
                            });
                        } else throw authErr;
                    }
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                showAlert('Login Gagal', error.message, 'error');
                await signOut(auth);
            } finally { setButtonLoading('btn-login', false, originalText); }
        });

        document.getElementById('btn-logout').addEventListener('click', () => { 
            if(unsubscribeVerifikasi) unsubscribeVerifikasi();
            signOut(auth); 
        });

        // Auth Observer
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                if (user.email === "1988.gordi.vandi@gmail.com") {
                    try {
                        await setDoc(doc(db, "users", user.uid), { uid: user.uid, email: user.email, nama: "Gordi Vandi (Super Admin)", role: 'super_admin', npsn: 'ALL', status: 'active'}, { merge: true });
                    } catch(e) {}
                }
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        const userData = userDoc.data();
                        
                        if (userData.status === 'pending' && userData.role === 'admin_sekolah') {
                            await signOut(auth);
                            showAlert('Akun Belum Diverifikasi', `Akun Admin Sekolah (${userData.email}) masih berstatus PENDING. Hubungi Super Admin.`, 'warning');
                            return;
                        }

                        currentUserState = userData;
                        document.getElementById('user-name-display').innerText = userData.nama;
                        document.getElementById('user-role-display').innerText = userData.role.replace('_', ' ');
                        document.getElementById('sidebar-npsn-label').innerText = userData.npsn === 'ALL' ? 'System Admin' : `NPSN: ${userData.npsn}`;
                        
                        if(userData.npsn !== 'ALL') {
                            const sekDoc = await getDoc(doc(db, "sekolah", userData.npsn));
                            if(sekDoc.exists()) document.getElementById('school-name-display').innerText = sekDoc.data().nama_sekolah;
                        } else document.getElementById('school-name-display').innerText = 'Super Administrator Portal';

                        buildSidebarMenu(userData.role);
                        authSection.classList.add('hidden');
                        mainApp.classList.remove('hidden');
                        
                        const defaultMenus = { 'super_admin': 'sa-dashboard', 'admin_sekolah': 'admin-dashboard', 'guru_mapel': 'guru-dashboard', 'wali_kelas': 'wali-dashboard', 'siswa': 'siswa-rapor' };
                        loadView(defaultMenus[userData.role]);
                    } else { showAlert('Error', 'Data pengguna tidak ditemukan.', 'error'); signOut(auth); }
                } catch (error) { showAlert('Error', 'Gagal memuat profil', 'error'); }
            } else {
                currentUserState = null;
                authSection.classList.remove('hidden');
                mainApp.classList.add('hidden');
            }
        });

        const menuItems = {
            'super_admin': [
                { id: 'sa-dashboard', icon: 'fa-chart-pie', text: 'Dashboard Master' },
                { id: 'sa-verifikasi', icon: 'fa-check-circle', text: 'Verifikasi Admin' },
            ],
            'admin_sekolah': [
                { id: 'admin-dashboard', icon: 'fa-chart-bar', text: 'Dashboard Analitik' },
                { id: 'admin-sekolah', icon: 'fa-building', text: 'Profil & Wilayah Sekolah' },
                { id: 'admin-kepsek', icon: 'fa-user-tie', text: 'Kepala Sekolah' },
                { id: 'admin-guru', icon: 'fa-chalkboard-teacher', text: 'Data Guru & CRUD' },
                { id: 'admin-siswa', icon: 'fa-users', text: 'Data Siswa & Fase' },
                { id: 'admin-mapel', icon: 'fa-book', text: 'Mata Pelajaran' },
            ],
            'guru_mapel': [
                { id: 'guru-dashboard', icon: 'fa-home', text: 'Dashboard & Progress' },
                { id: 'guru-cptp', icon: 'fa-list-check', text: 'Input CP/TP' },
                { id: 'guru-nilai', icon: 'fa-marker', text: 'Input Nilai Mapel' },
            ],
            'wali_kelas': [
                { id: 'wali-dashboard', icon: 'fa-chart-pie', text: 'Dashboard Analytics' },
                { id: 'wali-p5', icon: 'fa-award', text: 'Form P5' },
                { id: 'wali-kehadiran', icon: 'fa-clipboard-user', text: 'Kehadiran Siswa' },
                { id: 'wali-ekskul', icon: 'fa-running', text: 'Ekstrakurikuler Dinamis' },
                { id: 'wali-rekap', icon: 'fa-file-invoice', text: 'Rekap Nilai' },
                { id: 'wali-cetak', icon: 'fa-print', text: 'Cetak Rapor Kumer' },
            ],
            'siswa': [ { id: 'siswa-rapor', icon: 'fa-print', text: 'Rapor Digital' } ]
        };

        function buildSidebarMenu(role) {
            dynamicMenu.innerHTML = '';
            const items = menuItems[role] || [];
            items.forEach(item => {
                const a = document.createElement('a');
                a.href = `#${item.id}`;
                a.className = 'menu-link flex items-center px-6 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition-colors border-l-4 border-transparent hover:border-primary';
                a.innerHTML = `<i class="fa-solid ${item.icon} w-6"></i> <span class="text-sm font-medium ml-2">${item.text}</span>`;
                a.onclick = (e) => { 
                    e.preventDefault(); 
                    loadView(item.id); 
                    if(window.innerWidth < 1024) toggleSidebar();
                };
                dynamicMenu.appendChild(a);
            });
        }

        function loadView(viewId) {
            if(activeChart1) { activeChart1.destroy(); activeChart1 = null; }
            if(activeChart2) { activeChart2.destroy(); activeChart2 = null; }
            if(unsubscribeVerifikasi) { unsubscribeVerifikasi(); unsubscribeVerifikasi = null; }

        async function renderSAVerifikasi() {
            appContent.innerHTML = `<div class="bg-darkpanel rounded-xl border border-slate-700 shadow-lg overflow-hidden"><div class="p-4 border-b border-slate-700 bg-slate-800/50 flex justify-between items-center"><h3 class="text-lg font-semibold text-white">Daftar Admin Sekolah (Real-Time Live Sync)</h3></div><div class="overflow-x-auto"><table class="w-full text-sm text-left text-slate-300 whitespace-nowrap"><thead class="text-xs uppercase bg-slate-800 text-slate-400"><tr><th class="px-4 md:px-6 py-3">NPSN</th><th class="px-4 md:px-6 py-3">Nama Admin / Sekolah</th><th class="px-4 md:px-6 py-3">Email</th><th class="px-4 md:px-6 py-3">Status</th><th class="px-4 md:px-6 py-3">Aksi</th></tr></thead><tbody id="table-verifikasi" class="divide-y divide-slate-700"><tr><td colspan="5" class="px-6 py-4 text-center"><span class="loader"></span> Menghubungkan real-time listener...</td></tr></tbody></table></div></div>`;
            
            const qVerifikasi = query(collection(db, "users"), where("role", "==", "admin_sekolah"));
            
            // Menggunakan onSnapshot untuk real-time listener agar data pendaftaran sekolah baru langsung masuk tanpa reload
            unsubscribeVerifikasi = onSnapshot(qVerifikasi, (snapshot) => {
                const tbody = document.getElementById('table-verifikasi');
                if(!tbody) return;
                tbody.innerHTML = '';
                
                if (snapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center">Belum ada pendaftar sekolah.</td></tr>';
                    return;
                }

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const badge = data.status === 'active' ? '<span class="bg-green-500/20 text-green-400 px-2 py-1 rounded text-xs">Active</span>' : '<span class="bg-yellow-500/20 text-yellow-400 px-2 py-1 rounded text-xs">Pending</span>';
                    const action = data.status === 'pending' ? `<button onclick="window.activateAdmin('${docSnap.id}')" class="bg-primary hover:bg-blue-600 text-white px-3 py-1 rounded text-xs mb-1">Aktifkan</button>` : `<button onclick="window.deactivateAdmin('${docSnap.id}')" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-xs mb-1">Nonaktifkan</button>`;
                    tbody.innerHTML += `<tr class="hover:bg-slate-800/50"><td class="px-4 md:px-6 py-4">${data.npsn || '-'}</td><td class="px-4 md:px-6 py-4">${data.nama}</td><td class="px-4 md:px-6 py-4">${data.email}</td><td class="px-4 md:px-6 py-4">${badge}</td><td class="px-4 md:px-6 py-4 flex flex-col gap-1 items-start">${action}</td></tr>`;
                });
            }, (error) => {
                console.error("Error pada listener verifikasi:", error);
            });
        }

            const res = await showConfirm('Aktifkan Admin?', 'Pengguna ini akan diberikan akses penuh.');

        window.deactivateAdmin = async (uid) => {

                        const ulangan = row.querySelector('.inp-ulangan').value;
                        const mid = row.querySelector('.inp-mid').value;

                setButtonLoading('btn-simpan-nilai', false, 'Simpan & Sinkron ke Wali Kelas');
            };

                const mapels = [];
                snapMapel.forEach(m => mapels.push(m.data().nama));

                const nilaiMap = {};
                snapNilai.forEach(n => {

                    nilaiMap[d.nisn][d.mapel] = d.nilai_akhir;

                    return;

                        <thead class="bg-slate-800 text-xs uppercase text-slate-400 sticky top-0">

                    mapels.forEach(m => {

                        html += `<td class="px-3 py-3 text-center">${val}</td>`;

                    const avg = count > 0 ? Math.round(total / count) : '-';
                    html += `<td class="px-3 py-3 text-center font-bold text-primary">${avg}</td></tr>`;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;
            };
        }

        async function renderSiswaRapor() {
            const npsn = currentUserState.npsn;

                        <h3 class="text-lg font-semibold text-white">Rapor Digital Peserta Didik</h3>
                        <button onclick="window.print()" class="bg-primary hover:bg-blue-600 text-white px-4 py-2 rounded text-sm"><i class="fa-solid fa-print mr-1"></i> Cetak / PDF</button>
                    </div>
                    <div id="preview-rapor-container" class="flex-1 overflow-y-auto bg-white text-black p-8 rounded-xl shadow-inner border border-slate-300">

                    </div>
                </div>

            try {
                const snapSiswa = await getDocs(query(collection(db, "siswa"), where("npsn", "==", npsn)));
                let siswa = null;
                snapSiswa.forEach(d => {
                    if(d.data().email === email || d.data().nisn === currentUserState.nisn || d.data().nama.toLowerCase().includes(currentUserState.nama.toLowerCase())) {
                        siswa = d.data();
                    }
                });

                if(!siswa && !snapSiswa.empty) {
                    siswa = snapSiswa.docs[0].data();
                }

                if(!siswa) {
                    document.getElementById('preview-rapor-container').innerHTML = '<p class="text-center text-red-500 py-12">Data siswa tidak ditemukan untuk akun ini.</p>';
                    return;
                }

                const nisn = siswa.nisn;
                const sekDoc = await getDoc(doc(db, "sekolah", npsn));
                const sekData = sekDoc.exists() ? sekDoc.data() : { nama_sekolah: 'Sekolah Dasar', alamat: '', tempat_penerbitan: 'Borong', tahun_pelajaran_aktif: '2026/2027', semester_aktif: 'Ganjil' };

                const kepsekDoc = await getDoc(doc(db, "kepala_sekolah", npsn));
                const kepsek = kepsekDoc.exists() ? kepsekDoc.data() : { nama: '-', nip: '-' };

                const snapMapel = await getDocs(query(collection(db, "mapel"), where("npsn", "==", npsn)));
                const snapNilai = await getDocs(query(collection(db, "nilai_mapel"), where("npsn", "==", npsn), where("nisn", "==", nisn)));
                const nilaiMap = {};
                snapNilai.forEach(n => { nilaiMap[n.data().mapel] = n.data(); });

                const hadirDoc = await getDoc(doc(db, "kehadiran", `${npsn}_${nisn}_hadir`));
                const hadir = hadirDoc.exists() ? hadirDoc.data() : { sakit: 0, izin: 0, alfa: 0 };

                const eksDoc = await getDoc(doc(db, "ekstrakurikuler", `${npsn}_${nisn}_eks`));
                const eks = eksDoc.exists() ? eksDoc.data() : { kegiatan: '-', keterangan: '-' };

                const p5Doc = await getDoc(doc(db, "p5", `${npsn}_${nisn}_p5`));
                const p5 = p5Doc.exists() ? p5Doc.data() : { tema: '-', deskripsi: '-' };

                    <div class="print-area space-y-6">

                            <h3 class="text-lg font-semibold uppercase">${sekData.nama_sekolah}</h3>
                            <p class="text-xs">${sekData.alamat || '-'}</p>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-x-4 text-sm py-2">
                            <div>
                                <table class="border-none w-full">
                                    <tr><td class="border-none py-1 font-semibold w-36">Nama Peserta Didik</td><td class="border-none py-1">: ${siswa.nama}</td></tr>
                                    <tr><td class="border-none py-1 font-semibold">NISN / NIS</td><td class="border-none py-1">: ${siswa.nisn}</td></tr>
                                    <tr><td class="border-none py-1 font-semibold">Sekolah</td><td class="border-none py-1">: ${sekData.nama_sekolah}</td></tr>
                                </table>
                            </div>
                            <div>
                                <table class="border-none w-full">
                                    <tr><td class="border-none py-1 font-semibold w-36">Kelas / Fase</td><td class="border-none py-1">: ${siswa.kelas} (${siswa.fase || 'Fase A'})</td></tr>
                                    <tr><td class="border-none py-1 font-semibold">Semester</td><td class="border-none py-1">: ${sekData.semester_aktif}</td></tr>
                                    <tr><td class="border-none py-1 font-semibold">Tahun Pelajaran</td><td class="border-none py-1">: ${sekData.tahun_pelajaran_aktif}</td></tr>
                                </table>
                            </div>
                        </div>

                        <div>
                            <h4 class="font-bold text-sm mb-2">A. CAPAIAN HASIL BELAJAR</h4>
                            <table>
                                <thead>
                                    <tr>
                                        <th class="w-12 text-center">No</th>
                                        <th class="w-48">Mata Pelajaran</th>
                                        <th class="w-16 text-center">Nilai Akhir</th>
                                        <th>Capaian Kompetensi / Deskripsi Kemajuan Belajar</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;

                let no = 1;
                snapMapel.forEach(m => {
                    const mapelNama = m.data().nama;
                    const n = nilaiMap[mapelNama] || { nilai_akhir: '-', deskripsi: '-' };
                    html += `
                        <tr>
                            <td class="text-center">${no++}</td>
                            <td class="font-medium">${mapelNama}</td>
                            <td class="text-center font-bold">${n.nilai_akhir}</td>
                            <td>${n.deskripsi}</td>
                        </tr>
                    `;
                });

                html += `
                                </tbody>
                            </table>
                        </div>

                        <div class="grid grid-cols-2 gap-6 pt-2">
                            <div>
                                <h4 class="font-bold text-sm mb-2">B. EKSTRAKURIKULER</h4>
                                <table>
                                    <thead><tr><th>Kegiatan Ekstrakurikuler</th><th>Keterangan</th></tr></thead>
                                    <tbody>
                                        <tr><td>${eks.kegiatan}</td><td>${eks.keterangan}</td></tr>
                                    </tbody>
                                </table>
                            </div>
                            <div>
                                <h4 class="font-bold text-sm mb-2">C. KETIDAKHADIRAN</h4>
                                <table>
                                    <thead><tr><th>Sakit (S)</th><th>Izin (I)</th><th>Tanpa Keterangan (A)</th></tr></thead>
                                    <tbody>
                                        <tr><td class="text-center">${hadir.sakit} hari</td><td class="text-center">${hadir.izin} hari</td><td class="text-center">${hadir.alfa} hari</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="pt-2">
                            <h4 class="font-bold text-sm mb-2">D. PROYEK PENGUATAN PROFIL PELAJAR PANCASILA (P5)</h4>
                            <table>
                                <thead><tr><th class="w-48">Tema Proyek</th><th>Deskripsi Perkembangan Karakter</th></tr></thead>
                                </thead>
                                <tbody>
                                    <tr><td class="font-medium">${p5.tema}</td><td>${p5.deskripsi}</td></tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="ttd-container pt-8 text-sm">
                            <div class="text-center">
                                <p>Mengetahui,</p>
                                <p>Orang Tua / Wali Murid</p>
                                <div class="h-20"></div>
                                <p class="border-b border-black w-48 mx-auto font-semibold">( ........................................ )</p>
                            </div>
                            <div class="text-center">
                                <p>${sekData.tempat_penerbitan || 'Borong'}, ${new Date().toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'})}</p>
                                <p>Kepala Sekolah</p>
                                <div class="h-16 flex justify-center items-center">
                                    ${kepsek.foto_url ? `<img src="${kepsek.foto_url}" class="h-16 object-contain">` : ''}
                                </div>
                                <p class="border-b border-black w-48 mx-auto font-semibold">${kepsek.nama}</p>
                                <p class="text-xs mt-0.5">NIP. ${kepsek.nip}</p>
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById('preview-rapor-container').innerHTML = html;
            } catch(err) {
                document.getElementById('preview-rapor-container').innerHTML = `<p class="text-red-500 text-center py-12">Gagal memuat rapor: ${err.message}</p>`;
            }
        }
    </script>
</body>
</html>
